<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self'; style-src 'self'">
<link rel="stylesheet" href="chat.css"></head>
<body>
<header>
  <span class="title">✳ Claude</span>
  <select id="model" title="Model"></select>
  <button id="new" title="New chat">＋</button>
  <button id="menu" title="Account & mode">⋯</button>
  <button id="close" title="Close (⌘E)">✕</button>
</header>
<div id="log"><div class="empty" id="empty"><b>Ask Claude anything.</b><br>Turn on “Use this page” to ask about the tab you’re reading.<br><span id="keyhint"></span></div></div>
<footer>
  <label class="page"><input type="checkbox" id="usepage"> Use this page <span id="pagename"></span></label>
  <div class="box">
    <textarea id="q" rows="1" placeholder="Message Claude…"></textarea>
    <button id="send" title="Send (Enter)">↑</button>
  </div>
</footer>
<script src="chat.js"></script>
</body></html>
